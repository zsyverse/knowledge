site_name: 知识库
site_description: 记录我学过的知识：大模型、强化学习、训练与推理
site_author: zsyverse
site_url: https://zsyverse.github.io/knowledge/
repo_url: https://github.com/zsyverse/knowledge
repo_name: zsyverse/knowledge
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 zsyverse

theme:
  name: material
  language: zh
  custom_dir: overrides
  icon:
    logo: material/book-open-page-variant
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle: { icon: material/weather-night, name: 切换到暗色 }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle: { icon: material/weather-sunny, name: 切换到亮色 }
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link

plugins:
  - search:
      lang: [zh, en]
      separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - blog:
      blog_dir: blog
      blog_toc: true
      post_date_format: long
      post_url_format: "{date}/{slug}"
      post_readtime: true
      post_readtime_words_per_minute: 300
      archive_name: 归档
      archive_date_format: yyyy 年 MM 月
      categories_name: 分类
      pagination_per_page: 10
      draft_on_serve: true
      draft_if_future_date: true
  - tags
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      fallback_to_build_date: true
      enable_git_follow: false

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds: { case: lower }
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - assets/javascripts/katex.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zsyverse

nav:
  - 首页: index.md
  - 大模型:
      - llm/index.md
      - Transformer 架构: llm/transformer.md
      - 预训练: llm/pretraining.md
      - 监督微调 SFT: llm/sft.md
  - 强化学习:
      - rl/index.md
      - 基础概念: rl/basics.md
      - 策略梯度与 PPO: rl/ppo.md
      - RLHF / DPO / GRPO: rl/rlhf.md
  - 博客:
      - blog/index.md
  - 论文笔记:
      - papers/index.md
  - 标签: tags.md
  - 写作指南: guide.md
